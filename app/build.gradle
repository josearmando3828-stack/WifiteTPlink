buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versión clásica ultra-compatible para compilación manual en terminal
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.tuusuario.wifitetplink'
    compileSdk 33

    defaultConfig {
        applicationId "com.tuusuario.wifitetplink"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
}
